name: pulse-production

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PULSE_AUTH_USERNAME: ${PULSE_AUTH_USERNAME:?PULSE_AUTH_USERNAME must be set}
      PULSE_AUTH_PASSWORD_HASH: ${PULSE_AUTH_PASSWORD_HASH:?PULSE_AUTH_PASSWORD_HASH must be set}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:?PULSE_JWT_SECRET must be set}
      PULSE_JWT_EXPIRATION_MS: ${PULSE_JWT_EXPIRATION_MS:-900000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN must be set}
      JPA_DDL_AUTO: validate
      PULSE_METRICS_ENABLED: ${PULSE_METRICS_ENABLED:-true}
      PULSE_METRICS_INTERVAL_MS: ${PULSE_METRICS_INTERVAL_MS:-5000}
      PULSE_METRICS_DEFAULT_LIMIT: ${PULSE_METRICS_DEFAULT_LIMIT:-100}
      PULSE_METRICS_MAX_LIMIT: ${PULSE_METRICS_MAX_LIMIT:-500}
      PULSE_ALERTS_DEFAULT_LIMIT: ${PULSE_ALERTS_DEFAULT_LIMIT:-100}
      PULSE_ALERTS_MAX_LIMIT: ${PULSE_ALERTS_MAX_LIMIT:-500}
      PULSE_HEALTH_ENABLED: ${PULSE_HEALTH_ENABLED:-true}
      PULSE_HEALTH_INTERVAL_MS: ${PULSE_HEALTH_INTERVAL_MS:-30000}
      PULSE_HEALTH_TIMEOUT_MS: ${PULSE_HEALTH_TIMEOUT_MS:-3000}
      PULSE_HEALTH_DEFAULT_LIMIT: ${PULSE_HEALTH_DEFAULT_LIMIT:-100}
      PULSE_HEALTH_MAX_LIMIT: ${PULSE_HEALTH_MAX_LIMIT:-500}
      PULSE_INCIDENTS_DEFAULT_LIMIT: ${PULSE_INCIDENTS_DEFAULT_LIMIT:-100}
      PULSE_INCIDENTS_MAX_LIMIT: ${PULSE_INCIDENTS_MAX_LIMIT:-500}
      PULSE_TELEGRAM_ENABLED: ${PULSE_TELEGRAM_ENABLED:-false}
      PULSE_TELEGRAM_BOT_TOKEN: ${PULSE_TELEGRAM_BOT_TOKEN:-}
      PULSE_TELEGRAM_CHAT_ID: ${PULSE_TELEGRAM_CHAT_ID:-}
      PULSE_TELEGRAM_API_BASE_URL: ${PULSE_TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      PULSE_TELEGRAM_TIMEOUT_MS: ${PULSE_TELEGRAM_TIMEOUT_MS:-5000}
    expose:
      - "8080"
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  reverse-proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
