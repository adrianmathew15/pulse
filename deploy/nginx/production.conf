map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pulse_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # TLS termination will be added here during deployment. Keeping forwarded
    # headers and WebSocket upgrade handling centralized makes HTTPS/WSS a
    # reverse-proxy-only change.
    location /api {
        proxy_pass http://pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }

    location = /actuator/health {
        proxy_pass http://pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
