name: pulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pulse}
      DB_USERNAME: ${POSTGRES_USER:-pulse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      CORS_ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      JPA_DDL_AUTO: validate
      PULSE_METRICS_ENABLED: ${PULSE_METRICS_ENABLED:-true}
      PULSE_METRICS_INTERVAL_MS: ${PULSE_METRICS_INTERVAL_MS:-5000}
      PULSE_METRICS_DEFAULT_LIMIT: ${PULSE_METRICS_DEFAULT_LIMIT:-100}
      PULSE_METRICS_MAX_LIMIT: ${PULSE_METRICS_MAX_LIMIT:-500}
      PULSE_ALERTS_DEFAULT_LIMIT: ${PULSE_ALERTS_DEFAULT_LIMIT:-100}
      PULSE_ALERTS_MAX_LIMIT: ${PULSE_ALERTS_MAX_LIMIT:-500}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
