spring:
  application:
    name: pulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${DB_USERNAME:pulse}
    password: ${DB_PASSWORD:pulse}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

pulse:
  cors.allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  security:
    username: pulse-test
    password-hash: "$2y$12$hxSE9aMIBU0Zl2LqrtY6pebNexMe.YITNP9CojYMIVDmVYEuKx6om"
    jwt-secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    jwt-expiration-ms: 900000
  metrics:
    simulation-enabled: ${PULSE_METRICS_ENABLED:true}
    generation-interval-ms: ${PULSE_METRICS_INTERVAL_MS:5000}
    default-query-limit: ${PULSE_METRICS_DEFAULT_LIMIT:100}
    maximum-query-limit: ${PULSE_METRICS_MAX_LIMIT:500}
  alerts:
    default-query-limit: ${PULSE_ALERTS_DEFAULT_LIMIT:100}
    maximum-query-limit: ${PULSE_ALERTS_MAX_LIMIT:500}
  health:
    enabled: ${PULSE_HEALTH_ENABLED:true}
    interval-ms: ${PULSE_HEALTH_INTERVAL_MS:30000}
    timeout-ms: ${PULSE_HEALTH_TIMEOUT_MS:3000}
    default-query-limit: ${PULSE_HEALTH_DEFAULT_LIMIT:100}
    maximum-query-limit: ${PULSE_HEALTH_MAX_LIMIT:500}
  incidents:
    default-query-limit: ${PULSE_INCIDENTS_DEFAULT_LIMIT:100}
    maximum-query-limit: ${PULSE_INCIDENTS_MAX_LIMIT:500}
  notifications:
    telegram:
      enabled: ${PULSE_TELEGRAM_ENABLED:false}
      bot-token: ${PULSE_TELEGRAM_BOT_TOKEN:}
      chat-id: ${PULSE_TELEGRAM_CHAT_ID:}
      api-base-url: ${PULSE_TELEGRAM_API_BASE_URL:https://api.telegram.org}
      timeout-ms: ${PULSE_TELEGRAM_TIMEOUT_MS:5000}
